workflow:
  eyebrow: How we work
  title: You start on this page.
  steps:
    - step: "01"
      title: You look around, then Let's talk
      description: You're on this site. When you're ready, tap Let's talk. No account,
        no homework, no need to know websites.
    - step: "02"
      title: A short Zoom call
      description: We look at your shop together. I'll tell you if a $500 template
        fits, or if custom is smarter. No obligation to move forward.
    - step: "03"
      title: You share your content
      description: Photos, logo, menu or portfolio, hours, and the words you want on
        the page. We put it together and send previews for your feedback.
    - step: "04"
      title: Review and refine
      description: We adjust until the site feels right. You approve before anything
        goes live.
    - step: "05"
      title: Launch and hand off
      description: We help connect your domain and publish your site. You get a live
        walkthrough plus a built-in CMS to update your own text and photos—no
        monthly plan. Need a bigger change later? It's quoted as you go.
