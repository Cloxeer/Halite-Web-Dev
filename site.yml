pricing:
  eyebrow: Pricing
  title: Clear starting prices
  description: Straightforward options for restaurants, tattoo shops, salons, and
    local businesses across Las Cruces, Albuquerque, Santa Fe, and El Paso.
    Every project starts with a free Zoom call—we confirm scope and price in
    writing before work begins.
  betaBadge: Founding rates
  billingToggleOnetime: Pay once
  billingToggleMonthly: Pay monthly
  upfrontHeading: Website build — pay once, you own it
  upfrontPlans:
    - id: starter
      name: Starter Site
      description: A focused 3–5 page site for shops and solo businesses—home, about,
        gallery or menu, and contact. You register your domain; we connect it at
        launch.
      price: $750
      betaPrice: $500
      priceSuffix: one-time
      features:
        - 3–5 pages custom-built for your business
        - Gallery or menu section, about, and contact
        - Contact form that emails you directly
        - Your domain connected at launch (you purchase the domain)
        - Edit your own text and photos with the built-in CMS
        - Complete site files plus written hosting instructions
      cta:
        label: Start with a Starter site
        href: /apply
      highlighted: false
    - id: full
      name: Full Site
      description: A complete 6+ page site for restaurants and shops that need a full
        menu, gallery, about, and more room to tell your story.
      price: $1,050
      betaPrice: $750
      priceSuffix: one-time
      features:
        - 6 or more pages customized to your business
        - Full menu, portfolio, or gallery section
        - About page, contact page, and extra sections
        - Your domain connected at launch (you purchase the domain)
        - Edit your own text and photos with the built-in CMS
        - Google Search Console setup at launch
      cta:
        label: Start with a Full site
        href: /apply
      highlighted: true
  handoffHeading: After launch — you own it, and you can edit it yourself
  handoffIntro: Every build includes a live walkthrough, your finished site files,
    and a built-in CMS so you can update text and photos anytime. No monthly
    plan, no lock-in.
  handoffOptions:
    - id: diy
      name: DIY Handoff — included
      description: Included with every website—no extra cost, no subscription. You
        leave the project owning your site and able to update it yourself.
      price: Included
      priceSuffix: ""
      features:
        - Live 1-hour walkthrough of your site, domain, and CMS
        - Built-in CMS to change your own text and photos anytime
        - Complete site ZIP plus written redeploy and hosting instructions
        - You purchase and own your domain—we connect DNS at launch
        - Need a bigger change later? Request a quote anytime
        - No monthly subscription, ever
      highlighted: true
  handoffNote: You purchase and own your domain name (usually about $12–$15 per
    year through GoDaddy, Namecheap, or similar). Halite does not buy domains on
    your behalf—you share access so we can connect your site. The live
    walkthrough and the built-in CMS are included with every build, so
    day-to-day text and photo updates are yours to make. Larger changes can be
    quoted anytime. Details are in our Service Agreement.
  waasHeading: Prefer to pay monthly? Finance the build
  waasNote: "Can't pay all at once? Split the same price over 6 or 12 months—your
    choice. This is financing to help you get online, not a subscription: once
    the term is paid you're done, and you own your site. No ongoing fees, no
    lock-in."
  waasPlans: []
  addonsHeading: Optional add-on
  addons:
    - name: English & Spanish Website
      price: Quote on request
      description: "Your key pages in both English and Spanish—a great fit for El
        Paso, southern New Mexico, and borderland customers. Price depends on
        how many pages and how much translation you need. Heads-up: the CMS
        doesn't auto-translate, so text you edit in English won't update the
        Spanish on its own—you update both, or send it over and I'll translate."
  testimonialNote: Founding clients who leave an honest Google review receive 10%
