<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Rio Jar — starter template</title>
  <link rel="stylesheet" href="../demo.css"/>
  <style>
    :root {
      --demo-bg: #eef6e4;
      --demo-ink: #1f3318;
      --demo-muted: #4d6844;
      --demo-accent: #3f7d2c;
      --demo-card: #f7fbee;
      --demo-font: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    .demo-hero h1 { font-family: var(--demo-font); font-weight: 800; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <div class="demo-top"><span>Rio Jar</span><span>Hot salsa</span></div>
    <div class="demo-hero">
      <h1>One jar. One story. Order by phone.</h1>
      <p>English and space for Spanish. A product photo, a price, and who to call.</p>
      <a class="demo-btn" href="tel:+15055550133">Order a jar</a>
    </div>
    <div class="demo-panel">
      <h2>The jar</h2>
      <p>Roasted jalapeño. 8 oz. Made in small batches.</p>
    </div>
    <p class="demo-note">Halite starter template · $500 · sample product, not a live brand.</p>
  </div>
</body>
</html>
