<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Oak &amp; Corner — starter template</title>
  <link rel="stylesheet" href="../demo.css"/>
  <style>
    :root {
      --demo-bg: #e7edf3;
      --demo-ink: #1a2744;
      --demo-muted: #4b5b75;
      --demo-accent: #1d4ed8;
      --demo-card: #f7f9fc;
      --demo-font: "Segoe UI", system-ui, sans-serif;
    }
    .demo-hero h1 { font-family: var(--demo-font); font-weight: 700; }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <div class="demo-top"><span>Oak &amp; Corner</span><span>Hardware</span></div>
    <div class="demo-hero">
      <h1>The shop on the corner. Hours you can trust.</h1>
      <p>Where you are, when you are open, and a tap to call. Built for someone looking you up on Maps.</p>
      <a class="demo-btn" href="tel:+15055550144">Call the shop</a>
    </div>
    <div class="demo-panel">
      <h2>Hours</h2>
      <p>Mon–Sat 8–6 · Sunday closed</p>
    </div>
    <p class="demo-note">Halite starter template · $500 · sample shop, not a live store.</p>
  </div>
</body>
</html>
