services:
  title: How we help local shops
  cards:
    - id: brand
      prompt: I want a site that
      emphasis: feels like my shop.
      icon: Globe
      serviceTitle: A page that looks like you
      body: Your photos, colors, menu or portfolio, hours, and story. One place that
        feels like walking into your shop, not a generic template.
      href: /work
      cta: See our work
    - id: pricing
      prompt: I want to know
      emphasis: what it costs.
      icon: Search
      serviceTitle: A clear number first
      body: We publish starting prices and confirm the full scope in writing before
        work begins. No hidden fees. You can think it over.
      href: /pricing
      cta: View pricing
    - id: cost
      prompt: I need a site
      emphasis: without learning web stuff.
      icon: Rocket
      serviceTitle: We sit on Zoom together
      body: You do not need to be technical. We share a screen, I ask what you like,
        you send photos when you can. We go at your pace.
      href: /process
      cta: See how we work
    - id: mobile
      prompt: People tap me
      emphasis: on Google Maps.
      icon: Zap
      serviceTitle: That tap deserves a real page
      body: Most people look you up on their phone. The page they open should load
        fast, show your photos, and make it easy to call or visit.
      href: /services#framework
      cta: How we build
    - id: updates
      prompt: I'll need to update
      emphasis: my menu later.
      icon: Layers
      serviceTitle: Change it yourself
      body: Your site comes with a simple editor so you can change menu items, photos,
        and hours without waiting on me. Bigger changes, I quote first.
      href: /pricing
      cta: See what's included
    - id: apply
      prompt: I'm ready for a
      emphasis: friendly conversation.
      icon: MessageCircle
      serviceTitle: Let's Talk About Your Project
      body: Share a few details and we will set a short Zoom. No hard sell. Just what
        you need, what it costs, and whether we fit.
      href: /apply
      cta: Let's talk
