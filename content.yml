founder:
  eyebrow: ""
  title: Hi, I'm Sebastian.
  name: Sebastian Salgado
  role: CS student, Halite Studio
  image: images/halite/sebastian-2.jpg
  images:
    - images/halite/sebastian-2.jpg
    - images/halite/sebastian-1.jpg
  imageAlt: Sebastian Salgado, Halite Studio
  paragraphs:
    - I run Halite Studio from Las Cruces while I study computer science. I
      started it because local shops deserve a page that looks like them, not a
      Facebook wall or a template they cannot change.
    - You work with me. We sit on Zoom. You send photos when you can. I will not
      sell you SEO magic. I will make a landing page that feels good in a hand,
      and show you how to update it.
  highlights:
    - label: Custom landing pages for local shops
    - label: You talk to the person building it
    - label: Clear prices before we start
    - label: Las Cruces, El Paso, southern NM
contactCta:
  title: Talk to me today
  subtitle: Text me or send a short note.
  body: Most owners want cost and timing. I will answer both on a free Zoom.
    Same-day reply on business days.
